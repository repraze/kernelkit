name: Publish kernelkit

# Stages @repraze/kernelkit when a `kernelkit-v<version>` tag is pushed. Nothing goes live until a
# maintainer approves it with 2FA: npmjs.com → package → Staged, or `npm stage approve <stage-id>`.
#
# Supply-chain posture:
# - npm staged publishing: CI can only stage; a human approves (2FA) before the version is installable.
# - npm trusted publishing (OIDC): no npm token in GitHub secrets. Configure on npmjs.com → package →
#   Trusted publisher → GitHub Actions (repraze/kernelkit, publish.yml, environment "npm").
# - --provenance: the package page links the exact commit and workflow run that built it.
# - Actions pinned to full commit SHAs, no persisted git credentials, least-privilege permissions,
#   installs with --ignore-scripts.

on:
    push:
        tags: ["kernelkit-v*"]

permissions: {}

concurrency:
    group: publish-kernelkit
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm
        permissions:
            contents: read
            id-token: write # OIDC for trusted publishing + provenance
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            # `npm stage` needs npm 12; exact version, released weeks before it was pinned (not "latest")
            - name: Use pinned npm
              run: npm install -g npm@12.2.1 && npm --version
            - name: Tag matches package version
              run: test "kernelkit-v$(node -p 'require("./packages/kernelkit/package.json").version')" = "$GITHUB_REF_NAME"
            - run: npm ci --ignore-scripts
            - run: npm run lint
            - run: npm run lint:design
            - run: npm run typecheck
            - run: npm run build -w @repraze/kernelkit
            - name: Stage for approval
              working-directory: packages/kernelkit
              # prereleases go to the "next" dist-tag so `npm install` keeps the stable one
              run: npm stage publish . --provenance --access public --tag ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
